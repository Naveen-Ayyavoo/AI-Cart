<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
    <title>AI Cart Mark</title>
    <defs>
        <linearGradient id="ai-mark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="ai-mark-spark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#4F46E5"/>
        </linearGradient>
        <linearGradient id="ai-mark-accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
    </defs>
    <!-- Background Container -->
    <rect width="64" height="64" rx="16" fill="url(#ai-mark-bg)"/>
    <rect width="62" height="62" x="1" y="1" rx="15" stroke="#334155" stroke-width="1" fill="none"/>

    <!-- Geometric Shopping Cart Frame -->
    <path d="M 14 18 L 19 18 L 24 38 L 47 38 L 52 24 L 21 24"
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart Base Accent Runner -->
    <path d="M 23 33 L 48 33"
          stroke="url(#ai-mark-accent)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Dual Stable Wheels -->
    <circle cx="26" cy="46" r="3.5" fill="#059669"/>
    <circle cx="26" cy="46" r="1.5" fill="#0F172A"/>
    <circle cx="45" cy="46" r="3.5" fill="#059669"/>
    <circle cx="45" cy="46" r="1.5" fill="#0F172A"/>

    <!-- Intelligence Spark (Neural Node / Intelligence in Every Click) -->
    <g transform="translate(36, 18)">
        <!-- 4-Point AI Intelligence Spark -->
        <path d="M 0 -10 Q 0 0 -10 0 Q 0 0 0 10 Q 0 0 10 0 Q 0 0 0 -10 Z"
              fill="url(#ai-mark-spark)"/>
        <!-- Core Precision Glow -->
        <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
        <!-- Satellite Circuit Dots -->
        <circle cx="-6" cy="-8" r="1" fill="#38BDF8" opacity="0.9"/>
        <circle cx="7" cy="8" r="1" fill="#818CF8" opacity="0.9"/>
        <circle cx="8" cy="-6" r="0.75" fill="#A5B4FC" opacity="0.8"/>
    </g>
</svg>

